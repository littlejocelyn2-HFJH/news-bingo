<style>
  :root {
    --paper: #f8f4ea;
    --paper-2: #fbf8f1;
    --ink: #36352f;
    --ink-soft: #6b675d;
    --mist: #c9d8d6;        /* 灰藍水彩底 */
    --mist-deep: #9fb6b4;
    --ochre: #c49a5a;       /* 黃土 */
    --sage: #8fa688;        /* 抹茶綠 */
    --indigo: #4a6378;      /* 藍染 */
    --vermilion: #b4442e;   /* 朱印 */
  }
  html, body {
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  body {
    font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
    color: var(--ink);
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    background: var(--mist);
    min-height: 100vh; min-height: 100dvh;
    letter-spacing: .04em;
  }
  /* 水彩暈染背景 */
  #wash {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    width: 100%; height: 100%;
  }
  input, textarea {
    -webkit-user-select: text; user-select: text;
    font-size: 18px !important;
    font-family: inherit;
  }

  /* ===== 頁首 ===== */
  .masthead {
    background: rgba(248,244,234,.88);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    border-bottom: 1px solid rgba(54,53,47,.25);
  }
  .masthead h1 { font-weight: 900; letter-spacing: .25em; }
  .status-label {
    border: 1px solid var(--ink); padding: 8px 16px;
    font-weight: 600; letter-spacing: .12em; background: var(--paper-2);
  }
  .status-label.ok { border-color: var(--indigo); color: var(--indigo); }

  .tally {
    display: inline-flex; align-items: baseline; gap: 8px;
    padding: 6px 18px; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink);
    font-weight: 600; color: var(--ink-soft);
  }
  .tally b { font-size: 26px; color: var(--ink); font-weight: 900; }

  /* 直書裝飾 */
  .tategaki {
    writing-mode: vertical-rl; text-orientation: upright;
    font-weight: 600; line-height: 2.1; letter-spacing: .3em;
    color: var(--ink);
  }
  .tategaki.small { font-weight: 400; font-size: 15px; line-height: 2.2; color: var(--ink-soft); letter-spacing: .2em; }

  /* ===== 九宮格 ===== */
  .board {
    width: min(94vw, calc(100vh - 240px), 740px);
    width: min(94vw, calc(100dvh - 240px), 740px);
    min-width: 300px;
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: clamp(10px, 1.8vw, 18px);
    perspective: 1200px;
  }
  .cell {
    position: relative; aspect-ratio: 1 / 1;
    background: var(--paper);
    border-radius: 6px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 8px;
    box-shadow: 0 1px 0 rgba(0,0,0,.05), 0 8px 18px rgba(60,80,80,.18);
    transition: transform .15s ease, box-shadow .2s ease, opacity .3s ease;
    overflow: hidden; color: var(--ink);
  }
  .cell::before {          /* 和紙細邊框 */
    content: ""; position: absolute; inset: 7px;
    border: 1px solid rgba(54,53,47,.22); border-radius: 3px; pointer-events: none;
  }
  .cell:active { transform: scale(.96); }
  .cell .blob { position: absolute; width: 78%; height: 78%; top: 6%; left: 11%; opacity: .75; }
  .cell .icon {
    position: relative; width: clamp(34px, 7vw, 62px); height: clamp(34px, 7vw, 62px);
    stroke: var(--ink); fill: none; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round;
  }
  .cell .title { position: relative; font-weight: 900; font-size: clamp(14px, 2.3vw, 21px); margin-top: 6px; letter-spacing: .12em; }
  .cell .status { position: relative; font-size: clamp(11px, 1.6vw, 14px); margin-top: 3px; color: var(--ink-soft); letter-spacing: .1em; }
  .cell .num {
    position: absolute; top: 12px; left: 14px;
    font-size: clamp(11px, 1.6vw, 14px); color: var(--ink-soft); letter-spacing: .05em;
  }
  .cell.locked { opacity: .45; }
  .cell.locked .status::before { content: "— "; }
  .cell.locked .status::after { content: " —"; }

  .cell.center:not(.done) { animation: breathe 2.4s ease-in-out infinite; }
  @keyframes breathe {
    0%,100% { box-shadow: 0 8px 18px rgba(60,80,80,.18), 0 0 0 0 rgba(196,154,90,.0); }
    50%     { box-shadow: 0 8px 18px rgba(60,80,80,.18), 0 0 0 8px rgba(196,154,90,.35); }
  }
  .cell .must {
    position: absolute; top: 10px; right: 10px;
    writing-mode: vertical-rl; letter-spacing: .1em;
    background: var(--vermilion); color: #fff7ee; font-weight: 900;
    font-size: clamp(10px, 1.5vw, 13px); padding: 6px 3px; border-radius: 2px;
  }
  .cell.done { background: #eef1e6; }
  .cell .seal {
    position: absolute; right: 6%; bottom: 6%;
    width: clamp(34px, 6.5vw, 58px); height: clamp(34px, 6.5vw, 58px);
    transform: rotate(-12deg); opacity: .9;
  }
  .cell.bingo { box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--ochre), 0 10px 22px rgba(60,80,80,.25); }
  .cell.flipping { animation: flip .6s ease-in-out; }
  @keyframes flip {
    0%   { transform: rotateY(0); }
    50%  { transform: rotateY(90deg) scale(1.05); }
    100% { transform: rotateY(0); }
  }
  @keyframes stamp {
    0%   { transform: rotate(-12deg) scale(2.2); opacity: 0; }
    70%  { transform: rotate(-12deg) scale(.92); opacity: .95; }
    100% { transform: rotate(-12deg) scale(1); opacity: .9; }
  }
  .cell.flipping .seal, .seal.stamp-in { animation: stamp .45s ease-out .3s both; }

  /* ===== Modal ===== */
  .overlay {
    position: fixed; inset: 0; background: rgba(54,60,58,.45);
    display: flex; align-items: center; justify-content: center; padding: 12px;
    backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px);
  }
  .overlay.hidden { display: none; }
  .panel {
    width: min(96vw, 720px); max-height: 92vh; max-height: 92dvh;
    background: var(--paper); border-radius: 6px;
    display: flex; flex-direction: column; overflow: hidden;
    box-shadow: 0 30px 60px rgba(30,40,40,.35);
    animation: rise .3s ease-out;
  }
  .panel-body { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  @keyframes rise { from { transform: translateY(18px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .panel-head { position: relative; overflow: hidden; border-bottom: 1px solid rgba(54,53,47,.2); }
  .panel-head .wash { position: absolute; inset: -20% -5%; width: 110%; height: 140%; opacity: .55; }
  .panel-head > *:not(.wash) { position: relative; }

  .desc {
    border-left: 3px solid var(--ochre); background: var(--paper-2);
    padding: 14px 16px; line-height: 2; font-size: 18px; color: var(--ink);
  }
  .desc b { color: var(--vermilion); font-weight: 900; }

  .btn {
    min-height: 56px; padding: 12px 24px; border-radius: 4px;
    font-weight: 600; font-size: 19px; letter-spacing: .15em;
    border: 1.5px solid var(--ink);
    transition: transform .1s, background .2s, opacity .2s;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .btn:active { transform: translateY(2px); }
  .btn:disabled { opacity: .35; pointer-events: none; }
  .btn-ink   { background: var(--ink); color: var(--paper); }
  .btn-paper { background: var(--paper-2); color: var(--ink); }
  .btn-indigo{ background: var(--indigo); color: #f4f1e8; border-color: var(--indigo); }
  .btn-ochre { background: var(--ochre); color: #2d2414; border-color: #a17c42; }
  .btn-red   { background: var(--vermilion); color: #fff7ee; border-color: var(--vermilion); }

  .field {
    width: 100%; border: none; border-bottom: 1.5px solid var(--ink-soft);
    background: transparent; padding: 10px 4px; outline: none; color: var(--ink);
  }
  .field:focus { border-bottom-color: var(--indigo); background: rgba(255,255,255,.5); }
  textarea.field {
    border: 1px solid rgba(54,53,47,.35); border-radius: 4px; padding: 12px; line-height: 2;
    background:
      repeating-linear-gradient(transparent 0 35px, rgba(74,99,120,.18) 35px 36px),
      var(--paper-2);
    background-position: 0 12px, 0 0;
    background-attachment: local;
  }
  .label { font-weight: 600; color: var(--ink-soft); letter-spacing: .15em; font-size: 15px; }

  /* ===== 畫布 ===== */
  .pad-wrap { touch-action: none; }
  canvas.pad {
    display: block; width: 100%; height: clamp(240px, 42vh, 420px);
    background: var(--paper-2);
    border: 1px solid rgba(54,53,47,.35); border-radius: 4px;
    touch-action: none; cursor: crosshair;
  }
  .swatch { width: 44px; height: 44px; border-radius: 999px; border: 3px solid var(--paper); box-shadow: 0 0 0 1px rgba(54,53,47,.3); }
  .swatch.active { box-shadow: 0 0 0 3px var(--ink); }
  .size-btn { min-width: 54px; height: 44px; border-radius: 4px; border: 1px solid rgba(54,53,47,.35); background: var(--paper-2); font-weight: 600; }

<script>
/* =========================================================
   設定區（老師可修改）
   ========================================================= */
const PADLET_URL = 'https://padlet.com/littlejocelyn2/padlet-s025i8dsrbtdeoj5z748';   // ← 班級 Padlet 網址
const SHEET_URL  = '';                 // ← Google Apps Script 網頁應用程式網址（留空＝不送試算表）
const SUBMIT_SECTION = '九宮格成果';   // ← 學生繳交總表時，要貼到 Padlet 的哪個區段

/* 各區段的分組連結（Breakout link）。留空＝打開整個板子（PADLET_URL） */

};

/* 老師預覽模式：網址加上 ?preview 即可，九格全開、不送出任何資料 */

/* 線條圖示（24×24） */
const ICONS = {
  1: '<path d="M4 20l4-1 11-11-3-3L5 16z"/><path d="M14 6l3 3"/><path d="M4 20l1.5-3.5"/>',
  2: '<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/>',
  3: '<path d="M4 15v-3a8 8 0 0116 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/>',
  4: '<rect x="3" y="5" width="18" height="14" rx="1"/><circle cx="9" cy="10" r="1.8"/><path d="M3 17l5-5 4 4 3-3 6 6"/>',
  5: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0013 0"/><path d="M12 17.5V21M8.5 21h7"/>',
  6: '<path d="M4 5h16v10H10l-5 4v-4H4z"/><path d="M8 9h8M8 12h5"/>',
  7: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 015 0c0 2-2.5 2-2.5 4"/><path d="M12 16.8v.4"/>',
  8: '<path d="M15 3l6 6-9 9H6v-6z"/><path d="M4 21h9"/><path d="M10 8l6 6"/>',
  9: '<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/>'
};

const TASKS = [
  { id: 1, title: '標題製造機', type: 'headline', wash: '#e6b8a6',
    desc: '先找到報紙上這篇報導的<b>原本標題</b>，一字不漏打出來；再幫它想一個<b>更吸睛的新標題</b>。' },
  { id: 2, title: '關鍵字 Tag', type: 'tags', wash: '#e3c48e',
    desc: '找出這篇報導最重要的 <b>3 個關鍵字</b>，把它們變成 Hashtag。' },
  { id: 3, title: '知音相惜', type: 'padlet', wash: '#a9c3c9', showGo: true,
    desc: '到 Padlet <b>聽一位同學的朗讀錄音</b>，並在貼文下方留言<b>具體稱讚</b>（例如：咬字清楚、語速剛好、很有感情）。' },
  { id: 4, title: '影像支援', type: 'aiimage', wash: '#b4c7a6',
    desc: '把這則新聞變成一張圖！寫一段<b>給 AI 的指令</b>，在 Padlet 用<b>「AI 影像」</b>產生圖片，貼到<b>「ai影像」</b>區段。' },
  { id: 5, title: '聲歷其境', type: 'identity', wash: '#d9b169',
    desc: '請挑選報導中最精華的<b>「完整一段」</b>，錄下你的朗讀。' },
  { id: 6, title: '記者 OS', type: 'text', wash: '#9fb9cf',
    desc: '如果你是採訪這則新聞的記者，心裡會有什麼<b>碎碎念</b>？寫下來吧。',
    placeholder: '例如：現場也太熱了吧……' },
  { id: 7, title: '靈魂拷問', type: 'text', wash: '#b7aac4',
    desc: '對這則新聞提出<b>一個好問題</b>。（不能只用「是／不是」回答的問題更好。）',
    placeholder: '例如：為什麼……？如果……會怎樣？' },
  { id: 8, title: '畫重點', type: 'photo', wash: '#d9a5a0',
    desc: '拍下報紙上的這篇報導，用<b>螢光筆</b>在照片上畫出<b>最重要的一句話</b>，再把這句話打出來，最後傳到 Padlet。' },
  { id: 9, title: '生活連線', type: 'text', wash: '#c2b38f',
    desc: '這則新聞讓你聯想到生活中的什麼事？用<b>一句話</b>寫下你的生活聯想。',
    placeholder: '例如：這讓我想到上次我們家……' },
];

const LINES = [[1,2,3],[4,5,6],[7,8,9],[1,4,7],[2,5,8],[3,6,9],[1,5,9],[3,5,7]];
const KANJI_NUM = ['', '一','二','三','四','五','六','七','八','九'];

/* =========================================================
   狀態（只存在記憶體）
   ========================================================= */
const state = { done: new Set(), data: {}, identity: null, celebrated: new Set(), allCelebrated: false };
let current = null;

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const SEAL_SVG = `
  <svg class="seal" viewBox="0 0 60 60" aria-hidden="true">
    <g filter="url(#rough)">
      <circle cx="30" cy="30" r="26" fill="none" stroke="#b4442e" stroke-width="3.2"/>
      <circle cx="30" cy="30" r="21.5" fill="none" stroke="#b4442e" stroke-width="1"/>
      <text x="30" y="27" text-anchor="middle" font-size="13" font-weight="900" fill="#b4442e" font-family="Noto Serif TC, serif">完</text>
      <text x="30" y="42" text-anchor="middle" font-size="13" font-weight="900" fill="#b4442e" font-family="Noto Serif TC, serif">成</text>
    </g>
  </svg>`;

/* =========================================================
   九宮格繪製
   ========================================================= */
function bingoCells() {
  const s = new Set();
  LINES.forEach(l => { if (l.every(i => state.done.has(i))) l.forEach(i => s.add(i)); });
  return s;
}

function renderBoard(justDoneId = null) {
  const board = $('board');
  board.innerHTML = '';
  const unlocked = state.done.has(5);
  const bc = bingoCells();

  TASKS.forEach(t => {
    const done = state.done.has(t.id);
    const locked = !PREVIEW && !unlocked && t.id !== 5;
    const flipNow = (t.id === justDoneId);

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'cell';
    if (t.id === 5) btn.classList.add('center');
    if (locked) btn.classList.add('locked');
    if (done) btn.classList.add('done');
    if (bc.has(t.id)) btn.classList.add('bingo');
    if (flipNow) btn.classList.add('flipping');

    let status = locked ? '未解鎖' : (t.id === 5 ? '從這裡開始' : '點我挑戰');
    if (done) status = '已完成・可修改';

    const washColor = done ? '#a9bd9d' : t.wash;
    btn.innerHTML = `
      <svg class="blob" viewBox="0 0 100 100" aria-hidden="true">
        <g filter="url(#wc)"><ellipse cx="50" cy="44" rx="${30 + (t.id % 3) * 3}" ry="${27 + (t.id % 2) * 4}" fill="${washColor}"/></g>
      </svg>
      <span class="num">其 ${KANJI_NUM[t.id]}</span>
      ${t.id === 5 && !done ? '<span class="must">必解</span>' : ''}
      <svg class="icon" viewBox="0 0 24 24">${ICONS[t.id]}</svg>
      <span class="title">${t.title}</span>
      <span class="status">${status}</span>
      ${done ? SEAL_SVG : ''}
    `;
    btn.addEventListener('click', () => openTask(t.id));
    board.appendChild(btn);
    if (flipNow) setTimeout(() => btn.classList.remove('flipping'), 800);
  });

  $('doneCount').textContent = state.done.size;
  $('lineCount').textContent = LINES.filter(l => l.every(i => state.done.has(i))).length;
}

function updateStatusBar() {
  if (typeof renderSubmitBtn === 'function') renderSubmitBtn();
  const bar = $('statusBar');
  if (state.identity) {
    bar.textContent = `挑戰者｜${state.identity.cls}-${state.identity.seat} ${state.identity.name}`;
    bar.classList.add('ok');
  } else {
    bar.textContent = '請先解鎖中央任務';
    bar.classList.remove('ok');
  }
}

/* =========================================================
   客製化 Dialog（取代 alert / confirm）
   ========================================================= */
const BTN_STYLE = { primary: 'btn-ink', success: 'btn-indigo', gold: 'btn-ochre', danger: 'btn-red', ghost: 'btn-paper', purple: 'btn-indigo' };

function showDialog({ icon = '・', wash = '#c9d8d6', title = '', html = '', buttons = [{ text: '好的', style: 'primary' }] }) {
  $('dlgIcon').textContent = icon;
  $('dlgWash').setAttribute('fill', wash);
  $('dlgTitle').textContent = title;
  $('dlgMsg').innerHTML = html;
  const wrap = $('dlgBtns');
  wrap.innerHTML = '';
  buttons.forEach(b => {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = `btn flex-1 ${BTN_STYLE[b.style || 'primary']}`;
    el.textContent = b.text;
    el.addEventListener('click', () => {
      $('dialog').classList.add('hidden');
      if ($('taskModal').classList.contains('hidden')) document.body.style.overflow = '';
      if (b.onClick) b.onClick();
    });
    wrap.appendChild(el);
  });
  $('dialog').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}

let toastTimer = null;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2000);
}

/* =========================================================
   任務 Modal
   ========================================================= */
function openTask(id) {
  const task = TASKS.find(t => t.id === id);
  if (!PREVIEW && id !== 5 && !state.done.has(5)) {
    showDialog({
      icon: '鎖', wash: '#d6d2c4',
      title: '這一格還沒解鎖',
      html: '請先點擊中央的<b style="color:var(--vermilion)">『聲歷其境』</b><br>完成身分登記與任務喔！',
      buttons: [
        { text: '前往中央任務', style: 'gold', onClick: () => openTask(5) },
        { text: '知道了', style: 'ghost' }
      ]
    });
    return;
  }

  current = { task, dirty: false, pad: null };
  $('headWash').setAttribute('fill', task.wash);
  $('taskIcon').innerHTML = ICONS[task.id];
  $('taskNo').textContent = `其 ${KANJI_NUM[task.id]}${state.done.has(id) ? '・已完成' : ''}`;
  $('taskTitle').textContent = task.title;
  $('taskBody').innerHTML = '';
  $('taskFooter').innerHTML = '';

  $('taskModal').classList.remove('hidden');
  document.body.style.overflow = 'hidden';

  const descBox = document.createElement('div');
  descBox.className = 'desc mb-5';
  descBox.innerHTML = task.desc;
  $('taskBody').appendChild(descBox);

  ({ canvas: buildCanvas, tags: buildTags, text: buildText, padlet: buildPadlet, identity: buildIdentity, headline: buildHeadline, photo: buildPhoto, aiimage: buildAiImage })[task.type](task);
}

function closeTaskModal(force = false) {
  if (!force && current && current.dirty) {
    showDialog({
      icon: '？', wash: '#e3c48e',
      title: '還沒儲存喔',
      html: '剛剛的內容還沒按「儲存」，<br>現在離開會<b style="color:var(--vermilion)">不見</b>喔！確定要離開嗎？',
      buttons: [
        { text: '繼續作答', style: 'primary' },
        { text: '不存了，離開', style: 'ghost', onClick: () => closeTaskModal(true) }
      ]
    });
    return;
  }
  $('taskModal').classList.add('hidden');
  document.body.style.overflow = '';
  current = null;
}
$('taskClose').addEventListener('click', () => closeTaskModal());

function addFooterBtn(text, style, onClick, extraClass = '') {
  const b = document.createElement('button');
  b.type = 'button';
  b.className = `btn ${BTN_STYLE[style]} ${extraClass}`;
  b.innerHTML = text;
  b.addEventListener('click', onClick);
  $('taskFooter').appendChild(b);
  return b;
}
function markDirty() { if (current) current.dirty = true; }

/* ---------- 完成任務 ---------- */
function completeTask(id, data, { silent = false, after = null } = {}) {
  const first = !state.done.has(id);
  state.data[id] = data;
  state.done.add(id);
  if (current) current.dirty = false;
  saveSession();
  sendToSheet(id, data);
  closeTaskModal(true);
  renderBoard(first ? id : null);
  updateStatusBar();

  setTimeout(() => {
    const celebrated = checkBingo();
    if (!celebrated) {
      if (after) after();
      else if (!silent) toast((first ? `「${TASKS[id-1].title}」完成` : '已更新內容') + (SHEET_URL ? '・已送給老師' : ''));
    }
  }, first ? 800 : 50);
}

/* ---------- Bingo 判定 ---------- */
function checkBingo() {
  const newLines = [];
  LINES.forEach((l, idx) => {
    if (!state.celebrated.has(idx) && l.every(i => state.done.has(i))) {
      state.celebrated.add(idx);
      newLines.push(idx);
    }
  });

  if (state.done.size === 9 && !state.allCelebrated) {
    state.allCelebrated = true;
    confetti(true);
    showDialog({
      icon: '滿', wash: '#d9b169',
      title: '九宮全滿，讀報達人',
      html: `${state.identity ? esc(state.identity.name) + '，' : ''}你完成了全部 9 個任務，<br>8 條連線全部達成。辛苦了！`,
      buttons: [{ text: '繳交到 Padlet', style: 'gold', onClick: openSubmit }, { text: '稍後', style: 'ghost' }]
    });
    return true;
  }
  if (newLines.length) {
    confetti();
    showDialog({
      icon: '賀', wash: '#e6b8a6',
      title: 'BINGO！連線成功',
      html: `目前已完成 <b style="color:var(--vermilion);font-size:26px">${state.celebrated.size}</b> 條連線。<br>繼續挑戰，看能不能全部連滿。`,

  }
  return false;
}

/* =========================================================
   type: canvas（手寫畫板）
   ========================================================= */
const PAPER = '#fbf8f1';
function createPad(container, savedDataURL) {
  const wrap = document.createElement('div');
  wrap.className = 'pad-wrap';
  const canvas = document.createElement('canvas');
  canvas.className = 'pad';
  wrap.appendChild(canvas);
  container.appendChild(wrap);

  const ctx = canvas.getContext('2d');
  let w = 0, h = 0, dpr = 1;
  let drawing = false, last = null, inked = !!savedDataURL;
  let color = '#2f2e2b', size = 5;

  function fillPaper() {
    ctx.save(); ctx.setTransform(1,0,0,1,0,0);
    ctx.fillStyle = PAPER; ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.restore();
  }
  function drawImage(src) {
    if (!src) return;
    const img = new Image();
    img.onload = () => ctx.drawImage(img, 0, 0, w, h);
    img.src = src;
  }
  function setup(restore) {
    const r = canvas.getBoundingClientRect();
    dpr = window.devicePixelRatio || 1;
    w = r.width; h = r.height;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    fillPaper();
    drawImage(restore);
  }
  const pos = (e) => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  const width = (e) => (e.pointerType === 'pen' && e.pressure > 0 ? size * (0.4 + e.pressure * 1.2) : size);
  function stroke(a, b, lw) {
    ctx.strokeStyle = color; ctx.lineWidth = lw;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }

  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    drawing = true;
    last = pos(e);
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.arc(last.x, last.y, width(e) / 2, 0, Math.PI * 2); ctx.fill();
    inked = true; markDirty();
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!drawing) return;
    e.preventDefault();
    const evts = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    (evts.length ? evts : [e]).forEach(ev => { const p = pos(ev); stroke(last, p, width(ev)); last = p; });
  });
  const end = (e) => { if (drawing) { e.preventDefault(); drawing = false; last = null; } };
  canvas.addEventListener('pointerup', end);
  canvas.addEventListener('pointercancel', end);
  canvas.addEventListener('pointerleave', end);

  // 阻止 iOS Safari 觸控捲動／橡皮筋效果
  ['touchstart', 'touchmove', 'touchend'].forEach(evt =>
    canvas.addEventListener(evt, (e) => e.preventDefault(), { passive: false })
  );
  wrap.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

  requestAnimationFrame(() => setup(savedDataURL));

  return {
    clear() { fillPaper(); inked = false; markDirty(); },
    hasInk: () => inked,
    toDataURL: () => canvas.toDataURL('image/png'),
    setColor(c) { color = c; },
    setSize(s) { size = s; },
    resize() { const snap = canvas.toDataURL('image/png'); setup(snap); }
  };
}

/* =========================================================
   type: photo（拍報紙 → 螢光筆畫重點 → 打出關鍵句）
   ========================================================= */
const PENS = [
  { key: 'y', name: '螢光黃', color: '#ffe100', alpha: 0.42, width: 0.035, swatch: '#f7df4a' },
  { key: 'p', name: '螢光粉', color: '#ff6fa5', alpha: 0.36, width: 0.035, swatch: '#f59ab9' },
  { key: 'r', name: '紅筆',   color: '#b4442e', alpha: 1,    width: 0.006, swatch: '#b4442e' }
];

function drawStrokes(ctx, strokes, rx, ry, rw, rh) {
  for (const st of strokes) {
    if (!st.pts.length) continue;
    ctx.save();
    ctx.globalAlpha = st.alpha;
    ctx.globalCompositeOperation = st.alpha < 1 ? 'multiply' : 'source-over';
    ctx.strokeStyle = st.color; ctx.fillStyle = st.color;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(1, st.w * rw);
    ctx.beginPath();
    st.pts.forEach((p, i) => {
      const X = rx + p[0] * rw, Y = ry + p[1] * rh;
      i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y);
    });
    if (st.pts.length === 1) ctx.lineTo(rx + st.pts[0][0] * rw + 0.1, ry + st.pts[0][1] * rh);
    ctx.stroke();
    ctx.restore();
  }
}

function compositeSync(img, strokes) {
  const c = document.createElement('canvas');
  c.width = img.naturalWidth || img.width; c.height = img.naturalHeight || img.height;
  const x = c.getContext('2d');
  x.drawImage(img, 0, 0, c.width, c.height);
  drawStrokes(x, strokes, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.88);
}
async function makeComposite(data) {
  if (!data || !data.base) return '';
  const img = await loadImg(data.base);
  return img ? compositeSync(img, data.strokes || []) : data.base;
}

function fileToBase(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const max = 2000, s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(); };
    img.src = url;
  });
}

function buildPhoto(task) {
  const body = $('taskBody');
  const saved = state.data[task.id] || null;
  let base = saved ? saved.base : null;
  let strokes = saved ? JSON.parse(JSON.stringify(saved.strokes || [])) : [];
  let baseImg = null, pen = PENS[0];

  body.insertAdjacentHTML('beforeend', `
    <div class="flex flex-wrap items-center gap-3 mb-3">
      <span class="label">第一步</span>
      <label for="photoInput" class="btn btn-ochre" style="min-height:50px">拍照／選照片</label>
      <input id="photoInput" type="file" accept="image/*" class="hidden">
      <span id="photoHint" class="text-sm tracking-wider text-[color:var(--ink-soft)]"></span>
    </div>
    <div id="hlTools" class="flex flex-wrap items-center gap-3 mb-3">
      <span class="label">第二步</span>
      ${PENS.map((p, i) => `<button type="button" class="size-btn pen-btn ${i === 0 ? 'active' : ''}" data-k="${p.key}"
         style="padding:0 12px"><span style="display:inline-block;width:16px;height:16px;border-radius:99px;background:${p.swatch};vertical-align:-2px;margin-right:6px"></span>${p.name}</button>`).join('')}
      <button type="button" id="undoBtn" class="size-btn" style="padding:0 12px">復原</button>
      <button type="button" id="wipeBtn" class="size-btn" style="padding:0 12px">清除筆跡</button>
    </div>
    <div class="pad-wrap"><canvas id="photoCanvas" class="pad" style="height:auto"></canvas></div>
    <label class="block mt-5">
      <span class="label">第三步｜打出你畫的那一句關鍵句</span>
      <textarea id="keySentence" class="field mt-1" rows="3" maxlength="150" placeholder="把最重要的那一句話打出來">${esc(saved && saved.sentence || '')}</textarea>
    </label>
    <div class="desc mt-4" style="border-left-color:var(--indigo);font-size:16px">
      第四步｜按「存成圖片」存到相簿，再按「複製關鍵句並前往 Padlet」，
      到 Padlet 的<b style="color:var(--vermilion)">「${esc(PHOTO_SECTION)}」</b>區段，按該區段下方的 <b>＋</b> 新增貼文：<b>上傳照片</b>，內文<b>貼上關鍵句</b>。
    </div>`);

  const input = $('photoInput'), canvas = $('photoCanvas'), ctx = canvas.getContext('2d');
  const ta = $('keySentence'), hint = $('photoHint'), tools = $('hlTools');
  let rect = { x: 0, y: 0, w: 0, h: 0 }, cssW = 0, cssH = 0, dpr = 1;
  let cache = null, live = null, drawing = false;

  function refreshUI() {
    hint.textContent = base ? '照片不清楚可以重拍' : '拍下報紙上的這篇報導（要拍清楚、拍正）';
    tools.style.opacity = base ? 1 : .4;
    tools.style.pointerEvents = base ? 'auto' : 'none';
  }

  function layout() {
    const maxW = canvas.parentElement.getBoundingClientRect().width;
    dpr = window.devicePixelRatio || 1;
    cssW = maxW;
    const maxH = Math.max(260, window.innerHeight * 0.55);
    if (baseImg) {
      const ratio = baseImg.height / baseImg.width;
      cssH = Math.min(maxW * ratio, maxH);
      const s = Math.min(cssW / baseImg.width, cssH / baseImg.height);
      rect = { w: baseImg.width * s, h: baseImg.height * s };
      rect.x = (cssW - rect.w) / 2; rect.y = (cssH - rect.h) / 2;
    } else {
      cssH = 260;
    }
    canvas.style.height = cssH + 'px';
    canvas.width = Math.round(cssW * dpr); canvas.height = Math.round(cssH * dpr);
    rebuildCache(); paint();
  }

  function rebuildCache() {
    cache = document.createElement('canvas');
    cache.width = canvas.width; cache.height = canvas.height;
    const x = cache.getContext('2d');
    x.setTransform(dpr, 0, 0, dpr, 0, 0);
    x.fillStyle = '#fbf8f1'; x.fillRect(0, 0, cssW, cssH);
    if (baseImg) {
      x.drawImage(baseImg, rect.x, rect.y, rect.w, rect.h);
      drawStrokes(x, strokes, rect.x, rect.y, rect.w, rect.h);
    } else {
      x.fillStyle = '#9a958a'; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.font = '600 22px "Noto Serif TC", serif';
      x.fillText('點這裡拍下報紙上的報導', cssW / 2, cssH / 2);
    }
  }
  function paint() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(cache, 0, 0);
    if (live) { ctx.setTransform(dpr, 0, 0, dpr, 0, 0); drawStrokes(ctx, [live], rect.x, rect.y, rect.w, rect.h); }
  }

  function setBase(dataURL) {
    return loadImg(dataURL).then(img => { base = dataURL; baseImg = img; layout(); refreshUI(); });
  }

  input.addEventListener('change', async () => {
    const f = input.files && input.files[0];
    input.value = '';
    if (!f) return;
    try {
      const d = await fileToBase(f);
      if (base && strokes.length) strokes = [];
      await setBase(d);
      markDirty();
      toast('照片已放上，開始畫重點吧');
    } catch (_) {
      showDialog({ icon: '照', wash: '#d9a5a0', title: '照片讀取失敗', html: '請再拍一次，或換一張照片試試。' });
    }
  });

  const norm = (e) => {
    const r = canvas.getBoundingClientRect();
    return [(e.clientX - r.left - rect.x) / rect.w, (e.clientY - r.top - rect.y) / rect.h];
  };
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (!baseImg) { input.click(); return; }
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    drawing = true;
    live = { color: pen.color, alpha: pen.alpha, w: pen.width, pts: [norm(e)] };
    paint();
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!drawing) return;
    e.preventDefault();
    const evts = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
    (evts.length ? evts : [e]).forEach(ev => live.pts.push(norm(ev)));
    paint();
  });
  const end = (e) => {
    if (!drawing) return;
    e.preventDefault();
    drawing = false;
    if (live && live.pts.length) { strokes.push(live); markDirty(); }
    live = null; rebuildCache(); paint();
  };
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => canvas.addEventListener(t, end));
  ['touchstart', 'touchmove', 'touchend'].forEach(t => canvas.addEventListener(t, e => e.preventDefault(), { passive: false }));

  tools.querySelectorAll('.pen-btn').forEach(b => b.addEventListener('click', () => {
    tools.querySelectorAll('.pen-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active'); pen = PENS.find(p => p.key === b.dataset.k);
  }));
  $('undoBtn').addEventListener('click', () => { if (strokes.pop()) { markDirty(); rebuildCache(); paint(); } });
  $('wipeBtn').addEventListener('click', () => {
    if (!strokes.length) return;
    showDialog({ icon: '消', wash: '#d6d2c4', title: '清除所有筆跡？', html: '照片會保留，只清掉畫的重點。',
      buttons: [{ text: '確定清除', style: 'danger', onClick: () => { strokes = []; markDirty(); rebuildCache(); paint(); } },
                { text: '取消', style: 'ghost' }] });
  });
  ta.addEventListener('input', markDirty);

  current.pad = { resize: layout };
  refreshUI();
  requestAnimationFrame(() => { if (base) setBase(base); else layout(); });

  /* ---- 驗證與儲存 ---- */
  function collect() {
    if (!baseImg) {
      showDialog({ icon: '照', wash: '#d9a5a0', title: '還沒拍照喔', html: '請先按「拍照／選照片」，<br>拍下報紙上的這篇報導。',
        buttons: [{ text: '去拍照', style: 'primary', onClick: () => input.click() }, { text: '稍後', style: 'ghost' }] });
      return null;
    }
    const sentence = ta.value.trim();
    if (!strokes.length && sentence.length < 2) {
      showDialog({ icon: '筆', wash: '#d9a5a0', title: '還沒畫重點', html: '請用螢光筆在照片上畫出最重要的一句話，<br>或在第三步打出這句話。' });
      return null;
    }
    return { base, strokes: JSON.parse(JSON.stringify(strokes)), sentence };
  }
  function commitKeepOpen(data) {
    const first = !state.done.has(task.id);
    state.data[task.id] = data; state.done.add(task.id);
    current.dirty = false;
    saveSession(); sendToSheet(task.id, data);
    renderBoard(first ? task.id : null); updateStatusBar();
    if (first) setTimeout(checkBingo, 2500);
  }

  addFooterBtn('存成圖片', 'ghost', () => {
    const d = collect(); if (!d) return;
    const img = compositeSync(baseImg, d.strokes);
    commitKeepOpen(d);
    shareImage(task, img);
  });
  addFooterBtn('複製關鍵句並前往 Padlet ↗', 'success', () => {
    const d = collect(); if (!d) return;
    const who = whoAmI();
    copyText(`【畫重點】${who ? who + '：' : ''}${d.sentence || '（見照片）'}`);
    openPadlet('photo');
    commitKeepOpen(d);
    toast(`已複製關鍵句，到「${PHOTO_SECTION}」區段按＋上傳照片`);
  }, 'flex-1');
  addFooterBtn('完成', 'primary', () => {
    const d = collect(); if (d) completeTask(task.id, d);
  }, 'sm:min-w-[120px]');
}

/* =========================================================
   type: aiimage（寫 AI 指令 → Padlet AI 影像）
   ========================================================= */
const AI_MOODS  = ['溫暖', '寒冷', '緊張', '熱鬧', '安靜', '悲傷', '充滿希望', '驚訝', '無奈'];
const AI_STYLES = ['水彩畫', '繪本插畫', '寫實照片', '日系漫畫', '剪紙', '3D 動畫'];

function keepOpenCommit(task, data) {
  const first = !state.done.has(task.id);
  state.data[task.id] = data; state.done.add(task.id);
  if (current) current.dirty = false;
  saveSession(); sendToSheet(task.id, data);

  if (first) setTimeout(checkBingo, 2500);
}

/* 圖片：用 iPad 分享選單（可存到照片），不支援時顯示圖片讓學生長按儲存 */
function dataURLtoFile(dataURL, name) {
  const bin = atob(dataURL.split(',')[1]);
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new File([arr], name, { type: 'image/png' });
}
function shareImage(task, dataURL) {
  const who = whoAmI();
  const name = `${who ? who.replace(/\s+/g, '_') + '_' : ''}${task.title}.png`;
  try {
    const file = dataURLtoFile(dataURL, name);
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: `${task.title}${who ? '｜' + who : ''}` })
        .then(() => toast('圖片已分享／儲存'))
        .catch(err => { if (err && err.name !== 'AbortError') showImageDialog(task, dataURL, name); });
      return;
    }
  } catch (_) {}
  showImageDialog(task, dataURL, name);
}
function showImageDialog(task, dataURL, name) {
  showDialog({
    icon: '圖', wash: '#e6b8a6',
    title: '長按圖片即可儲存',
    html: `<img src="${dataURL}" alt="${esc(task.title)}" class="mx-auto my-2"
             style="max-height:38vh;border:1px solid rgba(54,53,47,.3);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto">
           <div>iPad：<b>長按圖片 → 加入「照片」</b>，再到 Padlet 上傳。</div>

/* =========================================================

   ========================================================= */
const sendQueue = [];
let sending = false;

function setSync(kind, text) {
  const b = $('syncBadge');
  if (PREVIEW) { b.className = 'sync wait'; b.textContent = '老師預覽模式・不會送出資料'; return; }
  if (!SHEET_URL) { b.classList.add('hidden'); return; }
  b.className = 'sync ' + kind;
  b.textContent = text;
}

function shrinkImage(dataURL, max = 900) {
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, max / img.width);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      const x = c.getContext('2d');
      x.fillStyle = '#fbf8f1'; x.fillRect(0, 0, c.width, c.height);
      x.drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = () => resolve(dataURL);
    img.src = dataURL;
  });
}

function contentText(task, data) {
  if (data === undefined || data === null) return '';
  switch (task.type) {
    case 'tags':     return data.join(' ');
    case 'text':     return data;
    case 'aiimage':  return `AI 指令：${data.prompt}`;
    case 'headline': return `原標題：${data.orig}\n新標題：${data.mine}`;
    case 'padlet':   return '已在 Padlet 完成';
    case 'identity': return data.label;
    case 'canvas':   return '（手寫圖片）';
    case 'photo':    return data.sentence ? `關鍵句：${data.sentence}` : '（照片畫重點）';
  }
  return String(data);
}

async function sendToSheet(id, data) {
  if (PREVIEW || !SHEET_URL || !state.identity) return;
  const task = TASKS[id - 1];
  const p = {
    cls: state.identity.cls, seat: state.identity.seat, name: state.identity.name,
    taskId: id, title: task.title, content: contentText(task, data), sentAt: new Date().toISOString()
  };
  if (task.type === 'canvas' || task.type === 'photo') {
    const src = task.type === 'photo' ? await makeComposite(data) : data;
    const jpg = await shrinkImage(src, task.type === 'photo' ? 1400 : 900);
    p.image = jpg.split(',')[1];
    p.mime = 'image/jpeg';
  }
  // 同一格只保留最新一筆待送
  const i = sendQueue.findIndex(q => q.taskId === id);
  if (i !== -1) sendQueue.splice(i, 1);
  sendQueue.push(p);
  flushQueue();
}

async function flushQueue() {
  if (sending || !sendQueue.length) return;
  sending = true;
  setSync('wait', `傳送中…（${sendQueue.length}）`);
  while (sendQueue.length) {
    try {
      await fetch(SHEET_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(sendQueue[0])
      });
      sendQueue.shift();
    } catch (e) {
      setSync('fail', `尚未送出 ${sendQueue.length} 格・網路恢復後自動補送`);
      sending = false;
      return;
    }
  }
  sending = false;
  setSync('ok', '已同步給老師');
}
setInterval(flushQueue, 8000);
window.addEventListener('online', flushQueue);

/* =========================================================
   分頁暫存：重新整理不會遺失（關閉分頁才清除）
   ========================================================= */
const SESSION_KEY = 'newsBingo.v3';
function saveSession() {
  if (PREVIEW) return;
  try {
    sessionStorage.setItem(SESSION_KEY, JSON.stringify({
      done: [...state.done], data: state.data, identity: state.identity,
      celebrated: [...state.celebrated], allCelebrated: state.allCelebrated, submitted: !!state.submitted
    }));
  } catch (_) {}
}
function loadSession() {
  if (PREVIEW) return;
  try {
    const raw = sessionStorage.getItem(SESSION_KEY);
    if (!raw) return;
    const o = JSON.parse(raw);
    state.done = new Set(o.done || []);
    state.data = o.data || {};
    state.identity = o.identity || null;
    state.celebrated = new Set(o.celebrated || []);
    state.allCelebrated = !!o.allCelebrated;
    state.submitted = !!o.submitted;
  } catch (_) {}
}

/* =========================================================
   繳交總表到 Padlet
   ========================================================= */
function wrapLines(ctx, text, maxW, maxLines) {
  const lines = [];
  outer:
  for (const para of String(text).split('\n')) {
    let line = '';
    for (const ch of para) {
      if (ctx.measureText(line + ch).width > maxW && line) {
        lines.push(line); line = ch;
        if (lines.length === maxLines) break outer;
      } else line += ch;
    }
    if (line) lines.push(line);
    if (lines.length >= maxLines) { lines.length = maxLines; break; }
  }
  if (lines.length === maxLines && ctx.measureText(lines[maxLines - 1]).width > maxW - 20) {
    lines[maxLines - 1] = lines[maxLines - 1].slice(0, -1) + '…';
  }
  return lines;
}

function loadImg(src) {
  return new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
}

async function buildSummaryImage() {
  const W = 1200, M = 50, G = 18, HEAD = 170;
  const cw = (W - M * 2 - G * 2) / 3, ch = cw;
  const H = HEAD + ch * 3 + G * 2 + M + 40;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const x = c.getContext('2d');
  const font = (w, s) => `${w} ${s}px "Noto Serif TC", "Songti TC", "PMingLiU", serif`;

  x.fillStyle = '#c9d8d6'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#f8f4ea'; x.fillRect(20, 20, W - 40, H - 40);
  x.fillStyle = '#36352f';
  x.font = font(900, 46); x.textBaseline = 'top';
  x.fillText('讀報九宮格', M, 50);
  x.font = font(600, 30);
  const who = state.identity ? `${state.identity.cls}-${state.identity.seat} ${state.identity.name}` : '';
  x.fillText(who, M, 112);
  x.font = font(400, 24); x.fillStyle = '#6b675d';
  const meta = `完成 ${state.done.size}／9・連線 ${LINES.filter(l => l.every(i => state.done.has(i))).length} 條・${new Date().toLocaleDateString('zh-TW')}`;
  x.textAlign = 'right'; x.fillText(meta, W - M, 118); x.textAlign = 'left';

  for (const t of TASKS) {
    const r = Math.floor((t.id - 1) / 3), col = (t.id - 1) % 3;
    const bx = M + col * (cw + G), by = HEAD + r * (ch + G);
    const done = state.done.has(t.id);
    x.fillStyle = done ? '#fbf8f1' : '#ece8de'; x.fillRect(bx, by, cw, ch);
    x.strokeStyle = 'rgba(54,53,47,.35)'; x.lineWidth = 1.5; x.strokeRect(bx + .5, by + .5, cw - 1, ch - 1);
    x.fillStyle = t.wash; x.fillRect(bx, by, cw, 54);
    x.fillStyle = '#36352f'; x.font = font(900, 26);
    x.fillText(`${KANJI_NUM[t.id]}　${t.title}`, bx + 16, by + 13);

    const d = state.data[t.id];
    const ix = bx + 16, iy = by + 70, iw = cw - 32, ih = ch - 86;
    if (!done) {
      x.fillStyle = '#9a958a'; x.font = font(600, 26); x.textAlign = 'center';
      x.fillText('（未完成）', bx + cw / 2, by + ch / 2); x.textAlign = 'left';
      continue;
    }
    if (t.type === 'photo') {
      const img = await loadImg(await makeComposite(d));
      const capH = d.sentence ? 80 : 0;
      if (img) {
        const s = Math.min(iw / img.width, (ih - capH) / img.height);
        const w = img.width * s, h = img.height * s;
        x.drawImage(img, ix + (iw - w) / 2, iy, w, h);
      }
      if (d.sentence) {
        x.fillStyle = '#36352f'; x.font = font(600, 22);
        wrapLines(x, '「' + d.sentence + '」', iw - 50, 2).forEach((ln, i) => x.fillText(ln, ix, iy + ih - capH + 8 + i * 34));
      }
    } else if (t.type === 'canvas') {
      const img = await loadImg(d);
      if (img) {
        const s = Math.min(iw / img.width, ih / img.height);
        const w = img.width * s, h = img.height * s;
        x.drawImage(img, ix + (iw - w) / 2, iy + (ih - h) / 2, w, h);
      }
    } else {
      x.fillStyle = '#36352f'; x.font = font(600, 26);
      const lines = wrapLines(x, contentText(t, d), iw, Math.floor(ih / 40));
      lines.forEach((ln, i) => x.fillText(ln, ix, iy + i * 40));
    }
    // 朱印
    x.save(); x.translate(bx + cw - 42, by + ch - 42); x.rotate(-0.2);
    x.strokeStyle = '#b4442e'; x.lineWidth = 3; x.beginPath(); x.arc(0, 0, 26, 0, Math.PI * 2); x.stroke();
    x.fillStyle = '#b4442e'; x.font = font(900, 20); x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillText('完成', 0, 1); x.restore();
    x.textAlign = 'left'; x.textBaseline = 'top';
  }
  return c.toDataURL('image/png');
}

function summaryText() {
  const who = state.identity ? `${state.identity.cls}-${state.identity.seat} ${state.identity.name}` : '';
  const rows = TASKS.filter(t => t.id !== 5).map(t => {
    const done = state.done.has(t.id);
    const v = !done ? '（未完成）'
      : t.type === 'canvas' ? '（手寫，見圖片）'
      : t.type === 'photo' ? `${state.data[t.id].sentence || ''}（照片見 Padlet）`
      : contentText(t, state.data[t.id]);
    return `${KANJI_NUM[t.id]}・${t.title}：${v}`;
  });
  return `【讀報九宮格】${who}\n` + rows.join('\n');
}

function askSubmit() {
  const left = 9 - state.done.size;
  if (left > 0) {
    showDialog({
      icon: '交', wash: '#e3c48e',
      title: `還有 ${left} 格沒完成`,
      html: '現在繳交，未完成的格子會顯示「未完成」。<br>確定要先繳交嗎？（之後完成還可以再繳一次）',
      buttons: [
        { text: '先繳交', style: 'primary', onClick: openSubmit },
        { text: '繼續闖關', style: 'ghost' }
      ]
    });
  } else openSubmit();
}

async function openSubmit() {
  current = { task: null, dirty: false, pad: null };
  $('headWash').setAttribute('fill', '#e6b8a6');
  $('taskIcon').innerHTML = '<path d="M4 4h16v16H4z"/><path d="M4 10h16M4 15h16M10 4v16M15 4v16"/>';
  $('taskNo').textContent = '最後一步';
  $('taskTitle').textContent = '繳交九宮格';
  const body = $('taskBody'), foot = $('taskFooter');
  body.innerHTML = '<div class="text-center py-10 text-lg">總表製作中……</div>';
  foot.innerHTML = '';
  $('taskModal').classList.remove('hidden');
  document.body.style.overflow = 'hidden';

  const png = await buildSummaryImage();
  const text = summaryText();
  const title = state.identity ? `${state.identity.cls}-${state.identity.seat} ${state.identity.name} - 讀報九宮格` : '讀報九宮格';

  body.innerHTML = `
    <ol class="space-y-2 text-lg mb-4">
      <li><b>一、</b>按「存成圖片」，把總表存到相簿。</li>
      <li><b>二、</b>按「複製文字並前往 Padlet」。</li>
      <li><b>三、</b>在 Padlet 的<b style="color:var(--vermilion)">「${esc(SUBMIT_SECTION)}」</b>區段按 <b>＋</b> 新增貼文：內文長按<b>貼上</b>，再<b>附上總表圖片</b>。</li>
    </ol>
    <img id="summaryImg" src="${png}" alt="九宮格總表" class="w-full" style="border:1px solid rgba(54,53,47,.3)">
    <p class="mt-2 text-sm text-[color:var(--ink-soft)] tracking-wider">若「存成圖片」沒反應：長按上面的圖片 → 加入「照片」。</p>`;

  const sb = document.createElement('button');
  sb.type = 'button'; sb.className = 'btn btn-paper'; sb.textContent = '存成圖片';
  sb.addEventListener('click', () => shareImage({ title: '讀報九宮格' }, png));
  foot.appendChild(sb);

  const cb = document.createElement('button');
  cb.type = 'button'; cb.className = 'btn btn-indigo flex-1'; cb.textContent = '複製文字並前往 Padlet ↗';
  cb.addEventListener('click', () => {
    copyText(title + '\n' + text);
    openPadlet('submit');
    state.submitted = true; saveSession(); renderSubmitBtn();
    sendSubmitToSheet();
    setTimeout(() => toast('已複製，到 Padlet 貼上並附上圖片'), 400);
  });
  foot.appendChild(cb);
}

function sendSubmitToSheet() {
  if (PREVIEW || !SHEET_URL || !state.identity) return;
  sendQueue.push({
    cls: state.identity.cls, seat: state.identity.seat, name: state.identity.name,
    taskId: 0, title: '繳交總表', content: `完成 ${state.done.size}／9`, sentAt: new Date().toISOString()
  });
  flushQueue();
}

function renderSubmitBtn() {
  const b = $('submitBtn');
  b.classList.toggle('hidden', !state.identity && !PREVIEW);
  b.textContent = state.submitted ? '再繳交一次（更新內容）' : '繳交九宮格到 Padlet';
}
$('submitBtn').addEventListener('click', askSubmit);

/* ---------- 複製到剪貼簿（相容 iPad Safari） ---------- */
function copyText(text) {
  let ok = false;
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).catch(() => {});
    ok = true;
  }
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:-1000px;left:0;opacity:0;font-size:16px';
    document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
    ok = document.execCommand('copy') || ok;
    ta.remove();
  } catch (_) {}
  return ok;
}

/* =========================================================
   慶祝：飄落的和紙花瓣
   ========================================================= */
let fxRAF = null;
function confetti(big = false) {
  const c = $('fx'), ctx = c.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const colors = ['#e6b8a6','#d9a5a0','#e3c48e','#a9c3c9','#b4c7a6','#b7aac4','#f3ede0','#b4442e'];
  const n = big ? 220 : 130;
  const parts = Array.from({ length: n }, () => ({
    x: Math.random() * innerWidth,
    y: -20 - Math.random() * innerHeight * 0.6,
    vy: Math.random() * 1.6 + 1.4,
    sway: Math.random() * 2 + 0.6, phase: Math.random() * Math.PI * 2,
    rx: Math.random() * 7 + 5, ry: Math.random() * 3 + 2.5,
    c: colors[(Math.random() * colors.length) | 0],
    rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.06
  }));
  cancelAnimationFrame(fxRAF);
  let frame = 0;
  const maxF = big ? 420 : 300;
  (function loop() {
    ctx.clearRect(0, 0, innerWidth, innerHeight);
    parts.forEach(p => {
      p.y += p.vy;
      p.x += Math.sin(frame / 30 + p.phase) * p.sway * 0.6;
      p.rot += p.vr;
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(.85, (maxF - frame) / 60));
      ctx.translate(p.x, p.y); ctx.rotate(p.rot);
      ctx.fillStyle = p.c;
      ctx.beginPath(); ctx.ellipse(0, 0, p.rx, p.ry, 0, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    });
    if (++frame < maxF) fxRAF = requestAnimationFrame(loop);
    else ctx.clearRect(0, 0, innerWidth, innerHeight);
  })();
}

   其他防呆
   ========================================================= */
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (current && current.pad) current.pad.resize(); }, 200);
});
window.addEventListener('beforeunload', (e) => {
  if (!PREVIEW && state.done.size > 0) { e.preventDefault(); e.returnValue = ''; }
});
document.addEventListener('gesturestart', (e) => e.preventDefault());

loadSession();
renderBoard();
updateStatusBar();
setSync('ok', '已同步給老師');
